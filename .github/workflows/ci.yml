name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      LLM_DEFAULT_PROVIDER: mock
      LLM_FALLBACK_PROVIDER: mock
      EMBEDDING_PROVIDER: local
      EMBEDDING_DIMENSION: 1024
      DINGTALK_ENABLED: "false"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      RATE_LIMIT_AUTH_PER_MIN: "120"
      RATE_LIMIT_EXTRACT_PER_MIN: "120"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Unit tests (no Postgres)
        run: >
          python -m pytest -x -q
          tests/test_guard_e2e.py
          tests/test_dingtalk_notify.py
          tests/test_health_rules.py
          tests/test_rag_hybrid.py
          tests/test_observability_p6.py
          tests/test_security_p9.py

  api-integration:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://montocrm:changeme@localhost:5432/montocrm_test
      LLM_DEFAULT_PROVIDER: mock
      LLM_FALLBACK_PROVIDER: mock
      EMBEDDING_PROVIDER: local
      EMBEDDING_DIMENSION: 1024
      DINGTALK_ENABLED: "false"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      RATE_LIMIT_AUTH_PER_MIN: "120"
      RATE_LIMIT_EXTRACT_PER_MIN: "120"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: montocrm
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: montocrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U montocrm -d montocrm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -x -q

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dummy env
        run: cp .env.example .env
      - name: Compose build api + web
        run: docker compose build api web
